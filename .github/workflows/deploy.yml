name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only when the app could have changed. Every deploy is a new app version as far as
    # installed phones are concerned: vite.config.ts stamps the commit sha into the bundle,
    # so the bundle hash, the precache manifest and the service worker all change, and every
    # install re-downloads the bundle and goes through src/app/update.ts's staged update —
    # for a commit that touched none of it. 20 of the 95 commits before 2026-09-23 changed
    # only paths listed here.
    #
    # An ignore list rather than an allow list on purpose. Get this wrong in one direction
    # and a deploy happens that did not need to, which is today's behaviour; an allow list
    # gets it wrong the other way, and a new file the build does read (a config, a new
    # top-level source directory) silently never ships. GitHub skips the run only when every
    # changed path matches. test/ is deliberately not here: its tests run below and gate
    # the deploy. workflow_dispatch is the manual override for anything this misjudges.
    paths-ignore:
      - 'infra/**'            # data pipeline; its own workflow is infra-image.yml
      - 'docs/**'
      - 'plans/**'
      - 'e2e/**'              # Playwright, run by hand against a local build, not here
      - 'assets/**'           # glyph build inputs; their output is committed in public/
      - 'scripts/**'          # icon and glyph generators, ditto
      - '.claude/**'
      - '**.md'               # every .md, the repository root included
      - '.github/workflows/infra-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight run finish rather than cancelling it
# mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      # Build before testing, not after: test/service-worker.test.ts checks the generated
      # service worker's update behaviour, which only exists in build output — with no
      # dist/ it skips itself and the guard is worthless in CI. `npm run build` runs tsc
      # first, so a type error still fails the job straight away.
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
